<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nearfield</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="drag-strip" data-tauri-drag-region></div>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <b>Nearfield</b>
        </div>
        <nav class="nav">
          <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
          <button class="nav-item" data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Поиск</button>
          <button class="nav-item" data-nav="mood"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.5c1.8 2 5.2 2 7 0M9 9.8h.01M15 9.8h.01"/></svg>Настроение</button>
          <button class="nav-item" data-nav="favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>Избранное</button>
        </nav>
        <div class="side-section">
          <div class="side-head"><span>Плейлисты</span><button class="icon-btn small" id="newPlaylist" title="Новый плейлист"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="side-playlists" id="sidePlaylists"></div>
        </div>
        <div class="side-foot">
          <button class="prep-card" id="prepCard" data-nav="settings">
            <span class="prep-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="prep-fill" cx="18" cy="18" r="15"/></svg></span>
            <span class="prep-text"><b id="prepTitle">3D-библиотека</b><small id="prepSub">—</small></span>
          </button>
          <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Настройки</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" data-tauri-drag-region>
          <div class="history-btns">
            <button class="icon-btn" id="backBtn" title="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          </div>
          <label class="search-box" id="topSearch">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="searchInput" type="search" placeholder="Трек, артист, альбом — Яндекс, SoundCloud, Spotify" autocomplete="off" spellcheck="false" />
            <kbd>⌘K</kbd>
          </label>
          <div class="top-right" data-tauri-drag-region></div>
        </header>
        <div class="view" id="view"></div>
      </main>

      <footer class="playerbar" id="playerbar">
        <div class="pb-track">
          <button class="pb-cover" id="pbCover" title="Открыть плеер"><img id="pbCoverImg" alt="" /><span class="pb-expand"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></span></button>
          <div class="pb-meta">
            <b id="pbTitle">Ничего не играет</b>
            <span id="pbArtist">Найди трек или выбери настроение</span>
          </div>
          <button class="icon-btn heart" id="pbHeart" title="В избранное"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></button>
        </div>
        <div class="pb-center">
          <div class="pb-controls">
            <button class="icon-btn" id="shuffleBtn" title="Перемешать"><svg viewBox="0 0 24 24"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg></button>
            <button class="icon-btn" id="prevBtn" title="Предыдущий"><svg viewBox="0 0 24 24" class="fill"><path d="M7 6h2v12H7zM10 12l9 6V6z"/></svg></button>
            <button class="play-btn" id="playBtn" title="Играть"><svg viewBox="0 0 24 24" class="fill i-play"><path d="M8 5.5v13l11-6.5z"/></svg><svg viewBox="0 0 24 24" class="fill i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><span class="spinner"></span></button>
            <button class="icon-btn" id="nextBtn" title="Следующий"><svg viewBox="0 0 24 24" class="fill"><path d="M15 6h2v12h-2zM14 12 5 6v12z"/></svg></button>
            <button class="icon-btn" id="repeatBtn" title="Повтор"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
          </div>
          <div class="pb-seek">
            <span id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="1000" value="0" />
            <span id="durTime">0:00</span>
          </div>
        </div>
        <div class="pb-right">
          <span class="pb-status" id="pbStatus"></span>
          <button class="toggle-pill" id="pb3d" title="3D-звук (D)">3D</button>
          <button class="toggle-pill" id="pbSlowed" title="Slowed">Slowed</button>
          <button class="toggle-pill" id="pbReverb" title="Reverb">Reverb</button>
          <button class="icon-btn" id="queueBtn" title="Очередь"><svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8M18 15v6l4-3z"/></svg></button>
          <div class="volume"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><input type="range" id="volume" min="0" max="100" value="85" /></div>
        </div>
      </footer>
    </div>

    <!-- Now playing -->
    <section class="np" id="np" hidden>
      <div class="np-bg"><img id="npBg" alt="" /></div>
      <header class="np-top" data-tauri-drag-region>
        <button class="icon-btn" id="npClose" title="Свернуть"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="np-context" id="npContext" data-tauri-drag-region></div>
        <button class="icon-btn" id="npImmersive" title="Погружение (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </header>
      <div class="np-body">
        <div class="np-left">
          <div class="np-stage">
            <canvas id="stageCanvas"></canvas>
            <img class="np-cover" id="npCover" alt="" />
          </div>
          <div class="np-title">
            <div>
              <h1 id="npTitle">—</h1>
              <button class="link" id="npArtist">—</button>
            </div>
            <button class="icon-btn heart big" id="npHeart"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></button>
          </div>
          <div class="np-tags" id="npTags"></div>
        </div>
        <div class="np-right">
          <div class="tabs" id="npTabs">
            <button data-tab="lyrics" class="active">Текст</button>
            <button data-tab="scene">3D-звук</button>
            <button data-tab="queue">Очередь</button>
          </div>
          <div class="tab-panel" data-panel="lyrics"><div class="lyrics" id="lyrics"></div></div>
          <div class="tab-panel" data-panel="scene" hidden><div id="scenePanel"></div></div>
          <div class="tab-panel" data-panel="queue" hidden><div id="queuePanel"></div></div>
        </div>
      </div>
    </section>

    <!-- Immersive -->
    <section class="immersive" id="immersive" hidden>
      <canvas id="immersiveCanvas"></canvas>
      <div class="imm-lyric" id="immLyric"></div>
      <div class="imm-meta"><b id="immTitle"></b><span id="immMode"></span></div>
      <button class="icon-btn imm-close" id="immClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </section>

    <div class="menu" id="menu" hidden></div>
    <div class="toast-zone" id="toasts"></div>
    <dialog class="modal" id="modal"></dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
