<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nearfield</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/phone.css" />
  </head>
  <body class="no-track">
    <div class="splash" id="splash">
      <div class="splash-mark">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="orbit"><i></i></span>
      </div>
      <b>Nearfield</b>
    </div>
    <div class="shell">
      <aside class="sidebar">
        <div class="drag-strip" data-tauri-drag-region></div>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <b>Nearfield</b>
        </div>
        <nav class="nav">
          <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
          <button class="nav-item" data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Поиск</button>
          <button class="nav-item" data-nav="wave"><svg viewBox="0 0 24 24"><path d="M3 12c2.5-5 4.5-5 6 0s3.5 5 6 0 4.5-5 6 0"/></svg>Моя волна</button>
          <button class="nav-item m-only" data-nav="library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 15"/></svg>Медиатека</button>
          <button class="nav-item m-only" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Настройки</button>
        </nav>
        <div class="side-section">
          <div class="side-head"><span>Медиатека</span><button class="icon-btn small" id="newPlaylist" title="Новый плейлист"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="side-playlists" id="sidePlaylists"></div>
        </div>
        <div class="side-foot">
          <button class="prep-card" id="prepCard" data-nav="settings">
            <span class="prep-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="prep-fill" cx="18" cy="18" r="15"/></svg></span>
            <span class="prep-text"><b id="prepTitle">Готово в 3D</b><small id="prepSub">—</small></span>
          </button>
          <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Настройки</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" data-tauri-drag-region>
          <div class="history-btns">
            <button class="icon-btn" id="backBtn" title="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          </div>
          <label class="search-box" id="topSearch">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="searchInput" type="search" placeholder="Трек, артист, альбом" autocomplete="off" spellcheck="false" />
            <kbd>⌘K</kbd>
          </label>
          <div class="top-right" data-tauri-drag-region></div>
        </header>
        <div class="view" id="view"></div>
      </main>

      <footer class="playerbar" id="playerbar">
        <div class="pb-progress" id="pbProgress"><input type="range" id="seek" min="0" max="1000" value="0" /></div>
        <div class="pb-track">
          <button class="pb-cover" id="pbCover" title="Открыть плеер"><img id="pbCoverImg" alt="" crossorigin="anonymous" /><span class="pb-expand"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></span></button>
          <div class="pb-meta"><b id="pbTitle"></b><span id="pbArtist"></span></div>
          <button class="icon-btn heart" id="pbHeart" title="В избранное (L)"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></button>
        </div>
        <div class="pb-center">
          <button class="icon-btn" id="shuffleBtn" title="Перемешать"><svg viewBox="0 0 24 24"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg></button>
          <button class="icon-btn" id="prevBtn" title="Назад"><svg viewBox="0 0 24 24" class="fill"><path d="M7 6h2v12H7zM10 12l9 6V6z"/></svg></button>
          <button class="play-btn" id="playBtn" title="Играть (Пробел)"><svg viewBox="0 0 24 24" class="fill i-play"><path d="M8 5.5v13l11-6.5z"/></svg><svg viewBox="0 0 24 24" class="fill i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><span class="spinner"></span></button>
          <button class="icon-btn" id="nextBtn" title="Дальше"><svg viewBox="0 0 24 24" class="fill"><path d="M15 6h2v12h-2zM14 12 5 6v12z"/></svg></button>
          <button class="icon-btn" id="repeatBtn" title="Повтор"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
        </div>
        <div class="pb-right">
          <span class="pb-time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></span>
          <span class="pb-status" id="pbStatus"></span>
          <button class="toggle-pill" id="pb3d" title="3D-звук (D)">3D</button>
          <button class="icon-btn" id="pbSound" title="Звук трека"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
          <button class="icon-btn" id="queueBtn" title="Очередь"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          <div class="volume"><button class="icon-btn small" id="muteBtn" title="Звук"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button><input type="range" id="volume" min="0" max="100" value="85" /></div>
        </div>
      </footer>
    </div>

    <!-- Now playing -->
    <section class="np" id="np" hidden>
      <div class="np-bg" id="npBg"></div>
      <div class="np-drag" data-tauri-drag-region></div>
      <button class="np-round np-close" id="npClose" title="Свернуть (Esc)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="np-body" id="npBody">
        <div class="np-left">
          <div class="np-art" id="npArt">
            <img class="np-cover" id="npCover" alt="" crossorigin="anonymous" />
            <div class="np-hover">
              <button class="np-round np-tr" id="npQueue" title="Очередь"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
              <div class="np-mid">
                <button class="np-round" id="npPrev" title="Назад"><svg viewBox="0 0 24 24" class="fill"><path d="M7 6h2v12H7zM10 12l9 6V6z"/></svg></button>
                <button class="np-play" id="npPlay" title="Играть (Пробел)"><svg viewBox="0 0 24 24" class="fill i-play"><path d="M8 5.5v13l11-6.5z"/></svg><svg viewBox="0 0 24 24" class="fill i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><span class="spinner"></span></button>
                <button class="np-round" id="npNext" title="Дальше"><svg viewBox="0 0 24 24" class="fill"><path d="M15 6h2v12h-2zM14 12 5 6v12z"/></svg></button>
                <button class="np-round small" id="npRepeat" title="Повтор"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
              </div>
              <button class="np-round np-bl" id="npMore" title="Ещё"><svg viewBox="0 0 24 24" class="fill"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
              <button class="np-round np-bc" id="npLyricsBtn" title="Текст"><svg viewBox="0 0 24 24"><path d="M4 6h10M9 6v13M14 12h6M14 16h6M14 20h4"/></svg></button>
              <button class="np-round np-br heart" id="npHeart" title="В избранное (L)"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></button>
            </div>
          </div>
          <div class="np-caption"><b id="npTitle"></b><button class="link" id="npArtist"></button></div>
          <div class="np-seek">
            <input type="range" id="npSeek" min="0" max="1000" value="0" />
            <div class="np-times"><span id="npCur">0:00</span><span id="npBadge"></span><span id="npDur">0:00</span></div>
          </div>
        </div>
        <div class="np-right"><div class="lyrics" id="lyrics"></div></div>
        <aside class="np-drawer" id="npDrawer">
          <header><button class="np-back" id="npDrawerClose" title="Назад (Esc)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><b id="npDrawerTitle"></b></button></header>
          <div class="np-drawer-body" id="soundPanel" data-panel="sound"></div>
          <div class="np-drawer-body" id="queuePanel" data-panel="queue"></div>
        </aside>
      </div>
    </section>

    <!-- Immersive: the track as a screensaver -->
    <section class="immersive" id="immersive" hidden>
      <div class="imm-bg"><img id="immBg" alt="" /><img id="immBg2" alt="" /></div>
      <div class="imm-stage">
        <img class="imm-cover" id="immCover" alt="" />
        <div class="imm-text">
          <div class="imm-lyric" id="immLyric"></div>
          <div class="imm-next" id="immNext"></div>
        </div>
      </div>
      <div class="imm-meta"><b id="immTitle"></b><span id="immArtist"></span><em id="immMode"></em></div>
      <div class="imm-ui">
        <div class="imm-controls">
          <button class="np-round" id="immPrev"><svg viewBox="0 0 24 24" class="fill"><path d="M7 6h2v12H7zM10 12l9 6V6z"/></svg></button>
          <button class="np-play" id="immPlay"><svg viewBox="0 0 24 24" class="fill i-play"><path d="M8 5.5v13l11-6.5z"/></svg><svg viewBox="0 0 24 24" class="fill i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
          <button class="np-round" id="immNextBtn"><svg viewBox="0 0 24 24" class="fill"><path d="M15 6h2v12h-2zM14 12 5 6v12z"/></svg></button>
        </div>
        <div class="imm-progress"><i id="immBar"></i></div>
      </div>
      <button class="np-round imm-close" id="immClose" title="Выйти (Esc)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" transform="rotate(180 12 12)"/></svg></button>
    </section>

    <div class="menu" id="menu" hidden></div>
    <div class="toast-zone" id="toasts"></div>
    <dialog class="modal" id="modal"></dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
