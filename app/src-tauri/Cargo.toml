[package]
name = "nearfield"
version = "0.1.0"
description = "Nearfield — spatial 3D music player"
edition = "2021"

[lib]
name = "nearfield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
regex = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
futures = "0.3"
souvlaki = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
